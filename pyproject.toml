[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safecross"
version = "0.1.0"
description = "Uncertainty-aware vulnerable-road-user prediction and closed-loop safety evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Harsh Saand" }]
dependencies = [
  "numpy>=1.26",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/safecross"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

